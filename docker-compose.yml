services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sgip
      POSTGRES_USER: sgip
      POSTGRES_PASSWORD: sgip
    ports:
      - "5432:5432"
    volumes:
      - sgip_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgip -d sgip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sgip
      DB_USER: sgip
      DB_PASSWORD: sgip
      JWT_SECRET: change-this-in-production
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - sgip_uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:80"

volumes:
  sgip_db:
  sgip_uploads:
